[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/wire",
  "crates/submission-journal",
  "crates/replica",
  "crates/store",
  "crates/session",
  "crates/wrapper",
  "crates/try",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grokbot-domain = { path = "crates/domain" }
grokbot-wire = { path = "crates/wire" }
grokbot-submission-journal = { path = "crates/submission-journal" }
grokbot-replica = { path = "crates/replica" }
grokbot-store = { path = "crates/store" }
grokbot-session = { path = "crates/session" }
