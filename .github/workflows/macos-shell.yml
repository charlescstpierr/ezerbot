name: Coque macOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler app/native/main.m
        run: bash tools/compile-native.sh

  tests:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain Rust (rust-toolchain.toml)
        run: rustup toolchain install 2>/dev/null || rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: gitleaks (commits de la PR ou du push)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          if [ -n "$BASE_REF" ]; then range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"
          else range="HEAD~1..HEAD"; fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range"
      - name: cargo test --workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: npm ci (app/web)
        working-directory: app/web
        run: npm ci --no-audit --no-fund
      - name: node --test app/web
        run: node --test app/web/src/*.test.js
      - name: node --test app/ui
        run: node --test app/ui/*.test.cjs app/ui/panels/*.test.cjs
