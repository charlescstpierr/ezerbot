[package]
name = "ezerbot-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Fenêtre Linux pour Ezerbot"

[target.'cfg(target_os = "linux")'.dependencies]
getrandom.workspace = true
global-hotkey = "=0.7.0"
gtk = "0.18"
nix = { version = "0.29", default-features = false, features = ["fs", "signal", "user"] }
percent-encoding = "2"
serde = { workspace = true }
serde_json.workspace = true
signal-hook = "0.3"
tao = "=0.37.2"
ureq = { version = "2", default-features = false }
url = "2"
wry = "=0.57.1"
# The same WebKitGTK binding wry uses, for the frame policy only.
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[dev-dependencies]
grokbot-test-support.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rusqlite.workspace = true
x11-dl = "2.21"
