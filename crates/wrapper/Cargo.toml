[package]
name = "grokbot-wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Application locale pour le moteur durable Grokbot"

[features]
test-support = []

[[bin]]
name = "grokbot-wrapper"
path = "src/main.rs"

[dependencies]
grokbot-domain = { workspace = true }
grokbot-store = { workspace = true }
grokbot-session = { workspace = true }
grokbot-submission-journal = { workspace = true }
grokbot-skills = { workspace = true }
grokbot-memory = { workspace = true }
grokbot-engine = { workspace = true }
grokbot-forms = { workspace = true }
grokbot-scheduler = { workspace = true }
grokbot-delegation = { workspace = true }
grokbot-attachments = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
jsonwebtoken = "9"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
getrandom = "0.2"
rustix = { version = "1", features = ["fs"] }
# Already locked via jsonwebtoken: RFC 8291 encryption and VAPID ES256.
ring = "0.17"
# Existing locked URL parser; endpoint validation must not use string heuristics.
url = "2"
# QR de jumelage iPhone : encodeur pur Rust, sans dépendance.
qrcodegen = "1.8"
# Fuseaux IANA de l'agenda : « demain » se juge dans le fuseau du calendrier.
jiff = { workspace = true }
# getpwuid_r sans unsafe dans cette crate (`forbid(unsafe_code)`).
nix = { version = "0.29.0", default-features = false, features = ["fs", "signal", "user"] }

[build-dependencies]
flate2 = "1"
brotli = "8"

[dev-dependencies]
# `progress_handler` counts every SQLite instruction of a read (routine_cost scale test).
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
# Décode les réponses Brotli servies, comme le ferait le navigateur.
brotli = "8"
grokbot-test-support = { workspace = true }
# Les intégrations compilent la bibliothèque sans cfg(test), même en release.
grokbot-wrapper = { path = ".", features = ["test-support"] }
nix = { version = "0.29.0", default-features = false, features = ["fs", "user"] }
# RLIMIT_NPROC : un arrêt de tâche tient quand plus aucun processus ne peut démarrer.
rustix = { version = "1", features = ["fs", "process"] }
# Relit le QR servi au Mac, comme le ferait l'appareil photo de l'iPhone.
rqrr = { version = "0.11", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }
core-foundation = "0.10"
