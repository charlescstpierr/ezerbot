[package]
name = "grokbot-linux-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Services du bureau Linux : Secret Service, notifications, liens ezerbot://, xdg-open"

[features]
test-support = ["dep:grokbot-test-support"]

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
grokbot-test-support = { workspace = true, optional = true }

[dev-dependencies]
grokbot-linux-desktop = { path = ".", features = ["test-support"] }
