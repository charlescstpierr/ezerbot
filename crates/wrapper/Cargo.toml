[package]
name = "grokbot-wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Application locale pour le moteur durable Grokbot"

[[bin]]
name = "grokbot-wrapper"
path = "src/main.rs"

[dependencies]
grokbot-domain = { workspace = true }
grokbot-store = { workspace = true }
grokbot-session = { workspace = true }
grokbot-submission-journal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
