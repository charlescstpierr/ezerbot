[workspace]
resolver = "2"
members = [
  "app/linux",
  "crates/domain",
  "crates/wire",
  "crates/submission-journal",
  "crates/replica",
  "crates/store",
  "crates/session",
  "crates/wrapper",
  "crates/try",
  "crates/skills",
  "crates/memory",
  "crates/engine",
  "crates/forms",
  "crates/scheduler",
  "crates/delegation",
  "crates/attachments",
  "crates/test-support",
]
# Copie corrigée de tiny_http : dépendance, pas membre (ni Clippy ni rustfmt du dépôt).
exclude = ["vendor/tiny_http"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
getrandom = "0.2"
jiff = "0.2"
grokbot-skills = { path = "crates/skills" }
grokbot-memory = { path = "crates/memory" }
grokbot-engine = { path = "crates/engine" }
grokbot-forms = { path = "crates/forms" }
grokbot-scheduler = { path = "crates/scheduler" }
grokbot-delegation = { path = "crates/delegation" }
grokbot-attachments = { path = "crates/attachments" }
grokbot-test-support = { path = "crates/test-support" }
grokbot-domain = { path = "crates/domain" }
grokbot-wire = { path = "crates/wire" }
grokbot-submission-journal = { path = "crates/submission-journal" }
grokbot-replica = { path = "crates/replica" }
grokbot-store = { path = "crates/store" }
grokbot-session = { path = "crates/session" }

# build.rs compresses every UI file at Brotli quality 11. Unoptimized that takes
# about a minute on each rerun, so the crates that do the work are optimized in
# dev too. The decoder is only used by tests and costs nothing to leave alone.
[profile.dev.package.brotli]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.alloc-stdlib]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.alloc-no-stdlib]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release.package.brotli]
opt-level = 3

[profile.release.package.alloc-stdlib]
opt-level = 3

[profile.release.package.alloc-no-stdlib]
opt-level = 3

# tiny_http 0.12.0 (dernière version) laisse une connexion sans fil pour la lire quand
# plusieurs arrivent ensemble : voir vendor/tiny_http/EZERBOT.md.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
