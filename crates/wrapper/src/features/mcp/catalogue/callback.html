<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Ezerbot</title>
<style>
:root { color-scheme: light; --surround:#ececee; --pane:#fff; --text:#0f1012; --muted:#5f6269; --line:#0f10121f; --ok:#1f9d55; --danger:#c42d1a; }
@media (prefers-color-scheme: dark) { :root { color-scheme:dark; --surround:#0a0b0d; --pane:#1b1e24; --text:#e6e7ea; --muted:#9a9fa9; --line:#ffffff17; --ok:#35c58a; --danger:#ff7a68; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--surround); color:var(--text); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
main { width:100%; max-width:420px; padding:32px; border:1px solid var(--line); border-radius:16px; background:var(--pane); }
.brand { margin:0 0 28px; font-size:24px; font-weight:650; letter-spacing:-1px; }
.brand span { color:#5b6b00; }
@media (prefers-color-scheme: dark) { .brand span { color:#e6ff3d; } }
.service { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; overflow-wrap:anywhere; }
h1 { margin:8px 0 16px; font-size:22px; line-height:1.35; font-weight:600; letter-spacing:-.4px; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; vertical-align:middle; background:var(--danger); }
[data-status="success"] .dot { background:var(--ok); }
p { margin:0 0 16px; overflow-wrap:anywhere; }
.return { margin:24px 0 0; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
@media (max-width:440px) { main { padding:24px; } }
</style>
</head>
<body>
<main data-status="{{status}}" aria-labelledby="result-title">
<p class="brand">ezerbot<span>.</span></p>
<div class="service">{{service}}</div>
<h1 id="result-title"><span class="dot" aria-hidden="true"></span>{{title}}</h1>
<p>{{message}}</p>
<p class="return">Vous pouvez fermer cet onglet et revenir dans Ezerbot.</p>
</main>
</body>
</html>
