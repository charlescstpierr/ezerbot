[package]
name = "grokbot-forms"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Saisies humaines, approbations et coffre local"

[dependencies]
grokbot-domain.workspace = true
grokbot-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
getrandom.workspace = true

[dev-dependencies]
grokbot-test-support = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
grokbot-linux-desktop = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
grokbot-linux-desktop = { workspace = true, features = ["test-support"] }
