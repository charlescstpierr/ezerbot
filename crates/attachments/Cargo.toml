[package]
name = "grokbot-attachments"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pièces jointes : images, prédescriptions et extraction locale de documents"

[dependencies]
grokbot-domain.workspace = true
grokbot-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
getrandom.workspace = true
base64 = "0.22"
# Bounded, in-memory Office ZIP/XML reading; no archive paths are extracted.
zip = { version = "6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.38"
# NFC keeps decomposed French accents readable in the PDF's WinAnsi font.
unicode-normalization = "0.1"
