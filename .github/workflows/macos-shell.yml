name: Coque macOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compiler app/native/main.m
        run: bash tools/compile-native.sh

  tests:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Toolchain Rust (rust-toolchain.toml)
        run: rustup toolchain install 2>/dev/null || rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: gitleaks (commits de la PR ou du push)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if ! head_sha="$(git rev-parse --verify HEAD 2>/dev/null)"; then
            echo "::error::Cannot resolve checkout HEAD." >&2
            exit 1
          fi
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Checkout HEAD does not match the event SHA." >&2
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != false ]; then
            echo "::error::Secret scan requires a complete Git history." >&2
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::Pull request base SHA must contain 40 hexadecimal characters." >&2
                exit 1
              fi
              if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
                echo "::error::Pull request base commit is unavailable." >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$BASE_SHA" HEAD 2>/dev/null; then
                echo "::error::Pull request base commit is not an ancestor of HEAD." >&2
                exit 1
              fi
              range="$BASE_SHA..HEAD"
              ;;
            push)
              if [[ ! "$BEFORE" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::Push before SHA must contain 40 hexadecimal characters." >&2
                exit 1
              fi
              if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                range=HEAD
              elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                echo "::error::Push before commit is unavailable." >&2
                exit 1
              else
                range="$BEFORE..HEAD"
              fi
              ;;
            *)
              echo "::error::Unsupported event for secret scan." >&2
              exit 1
              ;;
          esac
          printf 'Gitleaks scans %s\n' "$range"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--full-history --root -m $range"
      # Seule exclusion : voice_ui::french_audio_recognized_on_device_after_english, exempté par
      # Charles (24-10 23h48). Il demande la permission Speech de l'utilisateur, que ce runner ne
      # peut pas accorder (statut notDetermined). Il reste lancé sur le Mac (preuve-main-vert).
      # --exact : seul ce nom complet est exclu ; les 2 autres tests de voice_ui tournent ici.
      - name: cargo test --workspace
        run: cargo test --workspace --locked --no-fail-fast -- --skip french_audio_recognized_on_device_after_english --exact
      - name: npm ci (app/web)
        if: ${{ !cancelled() }}
        working-directory: app/web
        run: npm ci --no-audit --no-fund
      - name: node --test app/web
        if: ${{ !cancelled() }}
        run: node --test app/web/src/*.test.js
      - name: node --test app/ui
        if: ${{ !cancelled() }}
        run: node --test app/ui/*.test.cjs app/ui/panels/*.test.cjs
